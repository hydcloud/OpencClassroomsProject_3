spring.application.name=datashare-backend

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/datashare
spring.datasource.username=datashare
spring.datasource.password=datashare

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

storage.location=uploads

cleanup.expired-files-rate-ms=10000
